version: "3.8"

services:
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    ports:
      - "5001:5001"
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_LOG_LEVEL: "WARNING"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  pdffigures:
    image: figure-extractor
    ports:
      - "5002:5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      docling:
        condition: service_healthy
    volumes:
      - ../apps:/app/apps

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:3000"
    depends_on:
      - api

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    env_file:
      - ../.env
    depends_on:
      docling:
        condition: service_healthy
    volumes:
      - ../apps:/app/apps
